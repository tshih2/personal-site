<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Tim Shih</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@400;600&family=Geist+Mono:wght@500&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <script>
    tailwind.config = window.SITE_THEME;
  </script>

  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cream dot-grid text-ink font-geist">

  <!-- 進站載入動畫——見 js/page-loader.js。這個頁面原本沒有載入 GSAP
       (純文字版面不需要),這次為了共用同一套載入動畫補上。 -->
  <div id="pageLoader" class="fixed inset-0 z-[9999] bg-cream flex items-center justify-center" aria-hidden="true">
    <div class="loader-dots"></div>
  </div>
  <script src="js/page-loader.js"></script>
  <script>window.__pageLoader = initPageLoader();</script>

  <div id="app"></div>

  <script src="js/blog-post-template.js"></script>
  <script src="data/data-blog.js"></script>
  <script>
    renderBlogPost(BLOG_POSTS, '#app');
    const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
    fontsReady.then(() => window.__pageLoader.markReady());
  </script>
</body>
</html>
