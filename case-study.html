<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study | Tim Shih</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@400;600&family=Geist+Mono:wght@500&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <script>
    tailwind.config = window.SITE_THEME;
  </script>

  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cream text-ink font-geist lg:h-screen lg:overflow-hidden">

  <!-- 進站載入動畫——見 js/page-loader.js。ready 訊號由
       js/case-study-loader.js 在資料渲染完成(或找不到作品/資料載入
       失敗)後呼叫,見該檔案的 notifyReady()。 -->
  <div id="pageLoader" class="fixed inset-0 z-[9999] bg-cream flex items-center justify-center" aria-hidden="true">
    <div class="loader-dots"></div>
  </div>
  <script src="js/page-loader.js"></script>
  <script>window.__pageLoader = initPageLoader();</script>

  <div id="app"></div>

  <!-- 這是共用殼,不是單一作品專屬的頁面——實際顯示哪個作品由網址的
       ?work=<作品 slug> 參數決定,js/case-study-loader.js 依這個參數
       動態載入對應的 data/data-<作品 slug>.js,再呼叫
       renderCaseStudyPage()。新增作品時只要準備資料檔,不需要複製這個
       html。 -->
  <!-- 頁尾上一個/下一個作品導覽(見 js/case-study-template.js 的
       buildFooterNav())需要 WORKS_DATA/PLAY_DATA 這兩份清單決定循環
       順序,所以這裡也載入 data/data-works.js——跟首頁 index.html 是
       同一份資料來源,不是另外複製一份作品清單。 -->
  <script src="data/data-works.js"></script>
  <script src="js/case-study-template.js"></script>
  <script src="js/case-study-loader.js"></script>
</body>
</html>
